[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vocabulario"
version = "0.1.0"
description = "Personal Spanish vocabulary Telegram bot"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot[job-queue]>=22.5,<23", "httpx>=0.28,<0.29", "fsrs>=6,<7", "python-dotenv>=1,<2", "edge-tts>=7,<8", "tzdata>=2025.2", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]
data = ["nltk>=3.9,<4"]

[project.scripts]
vocabulario = "vocabulario.bot:main"

[tool.setuptools.packages.find]
include = ["vocabulario*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

